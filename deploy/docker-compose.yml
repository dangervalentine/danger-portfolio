# The portfolio on the remote server (root@91.99.62.133). It joins the
# `edge` network so the server's Caddy (server-edge), which owns ports 80 and 443, can
# forward dangervalentine.com (and www, redirected) to it by name; no port is open to the
# world. The loopback port is for curl on the server.
#
# On the server this is /opt/danger-portfolio/deploy/docker-compose.yml, in a checkout of the
# repository. A push to main deploys it: .github/workflows/deploy.yml builds the image, and
# server-edge's bin/deploy-hook pulls and starts it.
name: danger-portfolio

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    # CI builds the image and the server's deploy hook pulls it by commit (TAG); `latest` is
    # whatever the hook last deployed. `build:` stays for building on a machine of your own.
    image: ghcr.io/dangervalentine/danger-portfolio:${TAG:-latest}
    build:
      context: ..
    container_name: portfolio_web
    ports:
      - "127.0.0.1:5100:3100"
    networks: [edge]
    logging: *default-logging
    mem_limit: 384m
    restart: unless-stopped

networks:
  edge:
    external: true   # owned by server-edge (/opt/edge)
